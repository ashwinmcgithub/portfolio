[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/demos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/demos/*"
  to = "/demos/:splat"
  status = 200
